{% load static %}
<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>{% block title %}Global Estate{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'css/base.css' %}" />
    {% block extra_head %}{% endblock %}
  </head>
  <body>
    <div class="page-wrapper">
      <header class="site-header">
        <div class="container header__inner">
          <a class="brand" href="/">
            <span class="brand__icon">🏠</span>
            <span>Global Estate</span>
          </a>
          <button
            class="nav-toggle"
            type="button"
            data-toggle="nav"
            aria-controls="primary-navigation"
            aria-expanded="false"
          >
            Меню
          </button>
          <nav class="primary-nav" aria-label="Главная навигация">
            <ul class="site-nav" id="primary-navigation">
              <li><a class="nav-link" href="/">Главная</a></li>
              <li><a class="nav-link" href="/profile/">Профиль</a></li>
              <li><a class="nav-link" href="/favorites/">Избранное</a></li>
              <li><a class="nav-link nav-link--logout" href="/logout/">Выход</a></li>
            </ul>
          </nav>
        </div>
      </header>

      <main class="container content-area">
        {% block content %}{% endblock %}
      </main>

      <footer class="site-footer">
        <div class="container">
          © {{ now|date:"Y" }} <span>Global Estate.</span> Все права защищены.
        </div>
      </footer>
    </div>

    <script src="{% static 'js/base.js' %}" defer></script>
    {% block extra_scripts %}{% endblock %}
  </body>
</html>
